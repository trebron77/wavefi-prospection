[tool.pytest.ini_options]
# pytest 7+ : `pythonpath` evite tout sys.path.insert dans les tests.
# "."  -> import du package `src` (from src.agent import Agent)
# "tests" -> utilitaires partages (from helpers import FakeClient)
# "prospection_wifi" -> scripts du tunnel (from clean_leads import main), qui
# 	importent eux-memes `config` a plat
minversion = "7.0"
testpaths = ["tests"]
pythonpath = [".", "tests", "prospection_wifi"]
addopts = "-ra"
